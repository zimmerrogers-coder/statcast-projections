[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statcast-projection-sample"
version = "0.1.0"
description = "Hierarchical Bayesian wOBA projections from public Statcast data, tested against Marcel"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore"]
